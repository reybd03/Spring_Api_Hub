server:
  port: 8080

spring:
  application:
    name: automation-service
  datasource:
    url: jdbc:mysql://localhost:3306/automation_db?serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false
  webflux:
    base-path: /api/v1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    db:
      enabled: true
    diskspace:
      enabled: true

logging:
  level:
    com.spring.api.automation: DEBUG
    org.springframework.web.reactive: DEBUG
    org.hibernate.SQL: WARN

# Automation service specific config
automation:
  jenkins:
    default-url: http://localhost:8080
    default-port: "8080"
    default-username: admin
    default-password: admin
    default-base-path: "/"
    discovery-paths:
      - "/var/lib/jenkins"
      - "/usr/share/jenkins"
      - "/usr/local/share/jenkins"
      - "/opt/jenkins"
      - "C:/ProgramData/Jenkins/.jenkins"
      - "${user.home}/.jenkins"
  docker:
    compose-timeout: 120
  sse:
    heartbeat-interval: 30000
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: production
  labels:
    app: api-gateway
data:
  application-prod.yml: |
    server:
      port: 8080

    spring:
      application:
        name: api-gateway
      cloud:
        gateway:
          routes:
            - id: automation-service
              uri: lb://automation-service
              predicates:
                - Path=/products/automation/**
              filters:
                - StripPrefix=2
                - name: CircuitBreaker
                  args:
                    name: automation-service
                    fallbackUri: forward:/fallback/automation
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 1000
                    redis-rate-limiter.burstCapacity: 2000
                    key-resolver: "#{@userKeyResolver}"
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "https://app.example.com"
                allowedMethods: GET,POST,PUT,DELETE,OPTIONS
                allowedHeaders: "*"
                allowCredentials: true
                maxAge: 3600
      redis:
        cluster:
          nodes: ${REDIS_NODES}
        timeout: 2000ms
        lettuce:
          pool:
            max-active: 50
            max-idle: 20
            min-idle: 10

    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,circuitbreakers,prometheus
      endpoint:
        health:
          show-details: always
          probes:
            enabled: true
      health:
        circuitbreakers:
          enabled: true
        redis:
          enabled: true

    resilience4j:
      circuitbreaker:
        instances:
          automation-service:
            registerHealthIndicator: true
            slidingWindowSize: 20
            minimumNumberOfCalls: 10
            permittedNumberOfCallsInHalfOpenState: 5
            automaticTransitionFromOpenToHalfOpenEnabled: true
            waitDurationInOpenState: 60s
            failureRateThreshold: 30
            slowCallRateThreshold: 50
            slowCallDurationThreshold: 5s
      timelimiter:
        instances:
          automation-service:
            timeoutDuration: 10s
            cancelRunningFuture: true

    logging:
      level:
        org.springframework.cloud.gateway: INFO
        io.github.resilience4j: INFO
      pattern:
        console: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
      structured:
        format:
          console: json
  redis.nodes: "redis-1.prod:6379,redis-2.prod:6379,redis-3.prod:6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secrets
  namespace: production
  labels:
    app: api-gateway
type: Opaque
stringData:
  # These should be populated by external secret manager (Vault, SealedSecrets, etc.)
  # SPRING_REDIS_PASSWORD: ""
  # AUTOMATION_SERVICE_API_KEY: ""
  # JWT_SIGNING_KEY: ""
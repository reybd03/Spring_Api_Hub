version: '3.8'

services:
  # API Gateway
  api-gateway:
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
    image: api-gateway:staging
    container_name: api-gateway-staging
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=staging
      - SPRING_CLOUD_GATEWAY_ROUTES_0_URI=lb://automation-service
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SPRING_REDIS_TIMEOUT=2000ms
      - RESILIENCE4J_CIRCUITBREAKER_INSTANCES_AUTOMATION_SERVICE_REGISTERHEALTHINDICATOR=true
      - RESILIENCE4J_CIRCUITBREAKER_INSTANCES_AUTOMATION_SERVICE_SLIDINGWINDOWSIZE=10
      - RESILIENCE4J_CIRCUITBREAKER_INSTANCES_AUTOMATION_SERVICE_MINIMUMNUMBEROFCALLS=5
      - RESILIENCE4J_CIRCUITBREAKER_INSTANCES_AUTOMATION_SERVICE_FAILURE_RATE_THRESHOLD=50
      - RESILIENCE4J_CIRCUITBREAKER_INSTANCES_AUTOMATION_SERVICE_WAITDURATIONINOPENSTATE=30s
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,metrics,circuitbreakers
      - MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED=true
      - MANAGEMENT_ENDPOINT_HEALTH_SHOWDETAILS=always
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_CLOUD_GATEWAY=DEBUG
      - LOGGING_LEVEL_IO_GITHUB_RESILIENCE4J=DEBUG
      - JAVA_OPTS=-XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom
    depends_on:
      redis:
        condition: service_healthy
      automation-service:
        condition: service_healthy
    networks:
      - staging-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Redis for rate limiting
  redis:
    image: redis:7-alpine
    container_name: redis-staging
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - staging-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Automation Service (mock for staging)
  automation-service:
    image: wiremock/wiremock:3.5.0
    container_name: automation-service-staging
    ports:
      - "8081:8080"
    volumes:
      - ./wiremock:/home/wiremock
    command: >
      --verbose
      --global-response-templating
      --port 8080
      --root-dir /home/wiremock
    networks:
      - staging-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/__admin/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: prometheus-staging
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - staging-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana for visualization
  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana-staging
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana-data:/var/lib/grafana
    networks:
      - staging-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  staging-network:
    driver: bridge
    name: api-gateway-staging-network

volumes:
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
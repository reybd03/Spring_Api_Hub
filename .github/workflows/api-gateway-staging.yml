name: API Gateway - Staging Verification

on:
  workflow_dispatch:
    inputs:
      staging_url:
        description: 'Staging environment URL'
        required: true
        default: 'https://api-gateway-staging.example.com'
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - preview
          - production

  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - 'services/api-gateway/**'

  push:
    branches: [main]
    paths:
      - 'services/api-gateway/**'

env:
  JAVA_VERSION: '21'
  GRADLE_VERSION: '9.5.1'

jobs:
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: Build API Gateway
        run: ./gradlew :services:api-gateway:build -x test
        working-directory: ${{ github.workspace }}

      - name: Run Unit Tests
        run: ./gradlew :services:api-gateway:test
        working-directory: ${{ github.workspace }}

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: services/api-gateway/build/reports/tests/
          retention-days: 7

  integration-test:
    name: Integration Tests (Testcontainers)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: Run Integration Tests
        run: ./gradlew :services:api-gateway:test --tests "*GatewayIntegrationTest*"
        working-directory: ${{ github.workspace }}
        env:
          SPRING_REDIS_HOST: localhost
          SPRING_REDIS_PORT: 6379

  docker-build:
    name: Docker Build & Push
    needs: [build-and-test, integration-test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/api-gateway
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/api-gateway/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  staging-deploy:
    name: Deploy to Staging
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy to Staging
        run: |
          echo "Deploying to staging environment..."
          # Add your deployment command here
          # Example: kubectl set image deployment/api-gateway api-gateway=ghcr.io/${{ github.repository }}/api-gateway:${{ github.sha }} -n staging
        env:
          KUBECONFIG: ${{ secrets.STAGING_KUBECONFIG }}

      - name: Wait for Deployment
        run: |
          echo "Waiting for deployment to stabilize..."
          # kubectl rollout status deployment/api-gateway -n staging --timeout=300s

  staging-smoke-test:
    name: Staging Smoke Tests
    needs: staging-deploy
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Smoke Tests
        id: smoke-test
        run: |
          STAGING_URL="${{ github.event.inputs.staging_url || 'https://api-gateway-staging.example.com' }}"
          echo "Running smoke tests against $STAGING_URL"
          
          # Make script executable
          chmod +x services/api-gateway/staging/smoke-test.sh
          
          # Run smoke test
          ./services/api-gateway/staging/smoke-test.sh "$STAGING_URL"
        working-directory: ${{ github.workspace }}

      - name: Upload Smoke Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: services/api-gateway/staging/smoke-test-results/
          retention-days: 7

  staging-verification:
    name: Staging Verification Report
    needs: staging-smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Generate Verification Report
        run: |
          cat <<EOF > staging-verification-report.md
          # API Gateway Staging Verification Report
          
          **Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Commit**: ${{ github.sha }}
          **Branch**: ${{ github.ref_name }}
          **Workflow**: ${{ github.workflow }}
          **Run**: ${{ github.run_number }}
          
          ## Test Results
          
          | Test Suite | Status | Duration |
          |------------|--------|----------|
          | Build & Unit Tests | \${{ needs.build-and-test.result }} | - |
          | Integration Tests | \${{ needs.integration-test.result }} | - |
          | Docker Build | \${{ needs.docker-build.result }} | - |
          | Staging Deploy | \${{ needs.staging-deploy.result }} | - |
          | Smoke Tests | \${{ needs.staging-smoke-test.result }} | - |
          
          ## Acceptance Criteria
          
          - [ ] Health endpoint returns UP
          - [ ] Circuit breaker endpoint accessible
          - [ ] Fallback endpoints return 503
          - [ ] Routing to automation-service works
          - [ ] Rate limiting enforced
          - [ ] Actuator endpoints exposed
          - [ ] CORS headers present
          - [ ] Graceful shutdown configured
          
          ## Deployment Info
          
          - **Image**: ghcr.io/${{ github.repository }}/api-gateway:${{ github.sha }}
          - **Environment**: ${{ github.event.inputs.environment || 'staging' }}
          - **URL**: ${{ github.event.inputs.staging_url || 'https://api-gateway-staging.example.com' }}
          
          EOF
          
          cat staging-verification-report.md

      - name: Upload Verification Report
        uses: actions/upload-artifact@v4
        with:
          name: staging-verification-report
          path: staging-verification-report.md
          retention-days: 30

  notify:
    name: Notify on Failure
    if: failure()
    needs: [build-and-test, integration-test, docker-build, staging-deploy, staging-smoke-test]
    runs-on: ubuntu-latest
    steps:
      - name: Send Failure Notification
        run: |
          echo "::warning::API Gateway staging verification failed!"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run: ${{ github.run_id }}"
          # Add Slack/Teams/Email notification here
          # curl -X POST -H 'Content-type: application/json' \
          #   --data '{"text":"API Gateway staging verification failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
          #   ${{ secrets.SLACK_WEBHOOK }}
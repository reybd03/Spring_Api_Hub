spring.application.name=hub
server.port=8082

# --- Graceful shutdown and traffic draining -------------------------------------
# Every service in the platform needs these four settings so a rolling restart never
# drops traffic that was already accepted.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

management.endpoints.web.exposure.include=health,info,shutdown,shutdown-status
management.endpoint.shutdown.access=none
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

platform.shutdown.drain-timeout=20s
# Provide via the environment (HUB_SHUTDOWN_TOKEN). Blank disables the endpoint entirely.
platform.shutdown.shutdown-token=${HUB_SHUTDOWN_TOKEN:}

# MySQL Connection Settings
spring.datasource.url=jdbc:mysql://localhost:3306/hub_db?serverTimezone=UTC
spring.datasource.username=<username>
spring.datasource.password=<password>
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
# Use 'update' for development; switch to 'validate' or 'none' in production
# 'create-drop' to rebuild db tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# Reactive MySQL Connection Settings (R2DBC)
# Advanced R2DBC URL with encoded parameters
# Example includes: serverZoneId=UTC (UTC), useServerPrepareStatement=true, and zeroDate=use_null
# spring.r2dbc.url=r2dbc:pool:mysql://localhost:3306/hub_db
# spring.r2dbc.username=<username>
# spring.r2dbc.password=<password>
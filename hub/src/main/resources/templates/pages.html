<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Pages</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>

<body>
    <h1 th:text="${title}">Pages</h1>

    <h2>Products</h2>
    <ul id="ProductList">
    <li th:each="endpoint, iterStat : ${endpoints}">
        <a th:href="${endpoint}" th:text="${endpoints_text[iterStat.index]}"></a>
    </li>
    </ul>

    <!-- The button element with an explicit action type and ID for JavaScript targeting -->
    <button id="theme-toggle" type="button" aria-label="Toggle color theme">
        Toggle Theme
    </button>
    <!-- Links to src/main/resources/static/js/*.js -->
    <script th:src="@{/js/main.js}" type="text/javascript"></script>
</body>

</html>

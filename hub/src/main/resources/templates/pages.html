<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(${title})}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Pages</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>

<body>
    <div th:replace="~{fragments/layout :: header(${title})}"></div>

    <!-- Jenkins product view -->
    <div th:if="${title == 'Jenkins'}" th:replace="~{fragments/jenkins :: jenkinsContent}"></div>

    <!-- Generic product view (UML, Mainframe, etc.) -->
    <div th:unless="${title == 'Jenkins'}" id="content">
        <section class="card">
            <h2 th:text="${title} + ' Product Details'">Product Details</h2>
            <p th:text="'Overview and management for ' + ${title} + '.'"></p>
        </section>
    </div>

    <!-- Common scripts -->
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>

</html>

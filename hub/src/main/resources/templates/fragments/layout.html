<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Pages</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
    <div id="header" th:fragment="header(pageTitle)">
        <h1 th:text="${pageTitle}">Pages</h1>
        <nav class="navbar">
            <ul id="nav-list">
                <li th:each="navItem : ${navItems}">
                    <a th:href="${navItem.path}" th:text="${navItem.title}"></a>
                </li>
            </ul>
        </nav>

        <button id="theme-toggle" type="button" aria-label="Toggle color theme">
            Toggle Theme
        </button>
    </div>

    <div th:fragment="scripts">
        <script th:src="@{/js/main.js}" type="text/javascript"></script>
    </div>
</body>
</html>

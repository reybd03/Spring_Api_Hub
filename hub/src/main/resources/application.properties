spring.application.name=hub
server.port=8082

# --- Graceful shutdown and traffic draining -------------------------------------
# Stop accepting new connections on shutdown and let in-flight requests finish first.
# Spring Cloud Gateway, Kubernetes and Docker all honour the drain that follows.
server.shutdown=graceful
# Upper bound for the whole shutdown sequence (drain, then bean destruction).
spring.lifecycle.timeout-per-shutdown-phase=30s

# Actuator: probes drive traffic decisions, shutdown is the manual kill switch.
management.endpoints.web.exposure.include=health,info,shutdown
# Spring Boot disables this endpoint unless access is explicitly unrestricted.
management.endpoint.shutdown.access=unrestricted
# Adds /actuator/health/readiness, which reports OUT_OF_SERVICE while draining.
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Platform drain settings (see com.spring.api.hub.lifecycle).
# Keep drain-timeout below timeout-per-shutdown-phase so the drain wins the race and the
# shutdown hook still has budget left to tear the context down.
platform.shutdown.drain-timeout=20s
# Shared secret required by POST /actuator/shutdown, via the X-Shutdown-Token header.
# Left blank on purpose: the endpoint then refuses every caller instead of running
# unauthenticated. Supply it from the environment, never from a committed file.
platform.shutdown.shutdown-token=${HUB_SHUTDOWN_TOKEN:}

# MySQL Connection Settings
spring.datasource.url=jdbc:mysql://localhost:3306/hub_db?serverTimezone=UTC
spring.datasource.username=<username>
spring.datasource.password=<password>
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
# Use 'update' for development; switch to 'validate' or 'none' in production
# 'create-drop' to rebuild db tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# Reactive MySQL Connection Settings (R2DBC)
# Advanced R2DBC URL with encoded parameters
# Example includes: serverZoneId=UTC (UTC), useServerPrepareStatement=true, and zeroDate=use_null
# spring.r2dbc.url=r2dbc:pool:mysql://localhost:3306/hub_db
# spring.r2dbc.username=<username>
# spring.r2dbc.password=<password>
